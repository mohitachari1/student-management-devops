{% extends "base.html" %}{% block content %}
<h1>{{ 'Edit' if student else 'Add' }} Student</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<label>Name <input name="name" value="{{ student.name if student else '' }}" required></label>
<label>Email <input name="email" type="email" value="{{ student.email if student else '' }}"></label>
<label>Course <input name="course" value="{{ student.course if student else '' }}"></label>
<button class="btn">Save</button>
</form>
{% endblock %}
